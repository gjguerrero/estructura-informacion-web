<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" role="img" aria-labelledby="title desc"><title id="title">Flujo editorial de ejemplo</title><desc id="desc">Un borrador pasa a revisión y aprobación. Puede programarse antes de publicarse. La revisión puede devolverlo a borrador. Una publicación puede dar lugar a una nueva versión o retirarse.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#00587c"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#193743}.label{font-size:20px;font-weight:600}.note{font-size:17px}.small{font-size:16px}.line{fill:none;stroke:#00587c;stroke-width:2.5;marker-end:url(#arrow)}.box{fill:#edf5f8;stroke:#95bdcf;stroke-width:1.5}</style><rect width="100%" height="100%" rx="12" fill="#fafcfd"/><rect class="box" x="220" y="20" width="300" height="70" rx="9"/><text class="label" text-anchor="middle" x="370.0" y="48">Borrador</text><text class="small" text-anchor="middle" x="370.0" y="73">Redactar y completar</text><path class="line" d="M370 90 V117"/><rect class="box" x="220" y="123" width="300" height="70" rx="9"/><text class="label" text-anchor="middle" x="370.0" y="151">En revisión</text><text class="small" text-anchor="middle" x="370.0" y="176">Comprobar esta versión</text><path class="line" d="M370 193 V220"/><rect class="box" x="220" y="226" width="300" height="70" rx="9"/><text class="label" text-anchor="middle" x="370.0" y="254">Aprobado</text><text class="small" text-anchor="middle" x="370.0" y="279">Versión validada</text><path class="line" d="M370 296 V323"/><rect class="box" x="220" y="329" width="300" height="70" rx="9"/><text class="label" text-anchor="middle" x="370.0" y="357">Programado</text><text class="small" text-anchor="middle" x="370.0" y="382">Paso opcional</text><path class="line" d="M370 399 V426"/><rect class="box" x="220" y="432" width="300" height="70" rx="9" style="fill:#fff2e6"/><text class="label" text-anchor="middle" x="370.0" y="460">Publicado</text><text class="small" text-anchor="middle" x="370.0" y="485">Versión para la audiencia</text><path class="line" d="M370 502 V529"/><rect class="box" x="220" y="535" width="300" height="70" rx="9"/><text class="label" text-anchor="middle" x="370.0" y="563">Retirado o archivado</text><text class="small" text-anchor="middle" x="370.0" y="588">Según la política definida</text><path class="line" d="M220 157 H102 V55 H214"/><text class="note" x="16" y="112">Corregir</text><path class="line" d="M520 467 H650 V55 H526"/><text class="note" x="545" y="240">Nueva</text><text class="note" x="545" y="264">versión</text><path class="line" d="M220 261 H160 V467 H214"/><text class="small" x="20" y="326">Publicar</text><text class="small" x="20" y="348">ahora</text><text class="small" x="30" y="642">Cada transición requiere permisos y reglas.</text><text class="small" x="30" y="667">Actualizar puede mantener publicada la versión anterior durante la revisión.</text></svg>
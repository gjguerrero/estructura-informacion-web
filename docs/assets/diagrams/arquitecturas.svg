<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" role="img" aria-labelledby="title desc"><title id="title">CMS integrado y CMS headless</title><desc id="desc">En el modelo integrado, la gestión y las plantillas web forman parte de una misma solución. En el modelo headless, el CMS expone una API y distintas aplicaciones presentan la información.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#00587c"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#193743}.label{font-size:20px;font-weight:600}.note{font-size:17px}.small{font-size:16px}.line{fill:none;stroke:#00587c;stroke-width:2.5;marker-end:url(#arrow)}.box{fill:#edf5f8;stroke:#95bdcf;stroke-width:1.5}</style><rect width="100%" height="100%" rx="12" fill="#fafcfd"/><rect x="20" y="20" width="720" height="220" rx="12" fill="#e9f2f7"/><text class="label" x="40" y="58">CMS integrado</text><rect class="box" x="48" y="91" width="280" height="93" rx="9"/><text class="label" text-anchor="middle" x="188.0" y="119">Gestión y contenido</text><text class="small" text-anchor="middle" x="188.0" y="144">Panel, datos y reglas</text><rect class="box" x="430" y="91" width="280" height="93" rx="9"/><text class="label" text-anchor="middle" x="570.0" y="119">Plantillas y web</text><text class="small" text-anchor="middle" x="570.0" y="144">Presentación integrada</text><path class="line" d="M330 137 H420"/><text class="small" x="40" y="218">Una solución coordina edición y presentación pública.</text><rect x="20" y="270" width="720" height="365" rx="12" fill="#f5f8fa"/><text class="label" x="40" y="307">CMS headless</text><rect class="box" x="240" y="330" width="280" height="70" rx="9"/><text class="label" text-anchor="middle" x="380.0" y="358">Gestión y contenido</text><text class="small" text-anchor="middle" x="380.0" y="383">Panel, datos y reglas</text><path class="line" d="M380 400 V430"/><rect class="box" x="280" y="440" width="200" height="55" rx="9"/><text class="label" text-anchor="middle" x="380.0" y="474.5">API</text><path class="line" d="M380 495 V518 H130 V545"/><path class="line" d="M380 495 V545"/><path class="line" d="M380 495 V518 H630 V545"/><rect class="box" x="40" y="555" width="180" height="52" rx="9"/><text class="label" text-anchor="middle" x="130.0" y="588.0">Web</text><rect class="box" x="290" y="555" width="180" height="52" rx="9"/><text class="label" text-anchor="middle" x="380.0" y="588.0">Aplicación</text><rect class="box" x="540" y="555" width="180" height="52" rx="9"/><text class="label" text-anchor="middle" x="630.0" y="588.0">Pantalla</text></svg>